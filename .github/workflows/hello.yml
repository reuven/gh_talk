name: Hello, World

on: [push]

jobs:
    greet:
        runs-on: ubuntu-latest
        steps:
          - name: Say hello
            run: echo "Hello from my GitHub action"

    test:
        runs-on: ubuntu-latest

        strategy:
          matrix:
            python-version: ["3.14"]

        steps:
          - uses: actions/checkout@v6

          - name: Install uv
            uses: astral-sh/setup-uv@v8.1.0

          - name: Install dependencies
            run: uv sync

          - name: run tests
            run: uv run pytest
