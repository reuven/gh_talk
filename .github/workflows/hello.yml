name: Hello, World

on: [push]

jobs:
    greet:
        runs-on: ubuntu-latest
        steps:
          - name: Say hello
            run: echo "Hello from my GitHub action"

    test:
        runs-on: ubuntu-latest
        steps:
          - name: Install uv
            uses: astral-sh/setup-uv@v3

          - name: Install dependencies
            run: uv sync

          - name: run tests
            run: uv run pytest
